<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V42 SVR11 · May 2025</title><style>
body{font:16px system-ui;background:#f5f6f8;color:#172339;margin:0}main{max-width:1050px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin:0}small{color:#607087}header{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card,section{background:white;border:1px solid #dfe4eb;border-radius:12px;padding:20px}.value{font-size:28px;font-weight:650;margin-top:8px}section{margin:16px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #edf0f5}button{background:#eef2fa;border:0;padding:8px 12px;border-radius:7px;cursor:pointer}.PASS{color:#08765c}.FAIL{color:#b72d39}.RUNNING{color:#2457b3}.bar{height:6px;background:#d9e5f8;border-radius:3px;margin-top:18px}.bar div{height:100%;background:#2457b3}.FEASIBLE{color:#08765c}#days{display:flex;gap:7px;flex-wrap:wrap}.err{color:#b72d39}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}dialog{max-width:800px;border:1px solid #dfe4eb;border-radius:12px}a{color:#2457b3}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}main{margin:24px auto;padding:0 14px}}</style><main><header><div><h1>V42 · SVR11</h1><small>2025년 5월 공식 캠페인 · B0 → B2 → B1 → B3</small></div><small id="updated">연결 중</small></header><p id="notice" class="PASS"></p><div id="cards" class="cards"></div><section><h3>정책 진행률</h3><table><thead><tr><th>정책</th><th>PASS</th><th>FAIL</th><th>RUNNING</th><th>남은 날짜</th></tr></thead><tbody id="policies"></tbody></table></section><section><h3>현재 작업</h3><div id="current"></div></section><section><h3>날짜별 결과</h3><p><select id="policy" onchange="days()"><option>B0</option><option>B2</option><option>B1</option><option>B3</option></select> 날짜를 선택하면 전압·부하율·위반 건수를 확인합니다.</p><div id="days"></div></section><section><h3>최근 주요 오류</h3><div id="errors"></div></section><small id="source"></small><p><a href="/report">캠페인 보고서</a> · <a href="/evidence">실행·무결성 근거</a></p><dialog id="detail"><button onclick="detail.close()">닫기</button><div id="detailbody"></div></dialog></main><script>
let state;
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:3});
const percent=v=>v==null?'—':num(100*Number(v))+'%';
function gapPanel(w){
  const available=w.independent_global_gap_available===true||w.global_gap_certified===true;
  const independent=available?'독립 인증 LB '+num(w.certified_LB)+' · Gap '+percent(w.certified_Gap):(w.independent_global_bound_verified?'독립 인증 LB '+num(w.certified_LB)+' · Global Gap 미인증':'독립 인증 Global Gap · 미인증');
  const admitted=w.solver_global_gap_valid===true?'전체 C3A Solver LB '+num(w.solver_global_LB)+' · 검증 UB 기준 Gap '+percent(w.solver_global_gap):'전체 C3A Solver Global Gap · 아직 유효 Bound 없음';
  const raw='Solver ObjVal '+num(w.Solver_ObjVal)+' · ObjBound '+num(w.Solver_ObjBound)+' · Solver MIP Gap '+percent(w.Solver_MIPGap);
  const stats='Root LP '+num(w.Root_LP_seconds)+' s · B&amp;B Nodes '+num(w.B_and_B_Node_count)+' · Full MILP Native '+num(w.Full_MILP_Native_Runtime)+' s · Solver 최대 메모리 '+num(w.Solver_MaxMemUsed_GB)+' GB';
  const provenance=[w.solver_bound_provenance,w.independent_global_gap_provenance].filter(Boolean).map(esc).join(' · ');
  return '<small>'+raw+'<br>'+admitted+'<br>'+independent+' · 목표 3% '+(w.solver_global_gap_target_met===true?'달성':'평가 중')+'<br>'+stats+(provenance?'<br>근거: '+provenance:'')+'</small>';
}
async function update(){
  try{
    state=await(await fetch('/api/state',{cache:'no-store'})).json();let c=state.counts;
    notice.textContent=(state.intentional_dispatch_quiescence?state.status+' · ':'')+(state.notice||'');
    cards.innerHTML=[['완료 / 전체',c.completed+' / 124'],['현재 정책',state.policy||state.status],['PASS / FAIL',c.PASS+' / '+c.FAIL],['활성 Worker / ETA',state.workers.length+' / '+state.ETA]].map(([k,v])=>'<div class="card"><small>'+esc(k)+'</small><div class="value">'+esc(v)+'</div></div>').join('');
    policies.innerHTML=state.policies.map(p=>'<tr><td>'+p.policy+'</td><td class="PASS">'+p.PASS+'</td><td class="FAIL">'+p.FAIL+'</td><td class="RUNNING">'+p.RUNNING+'</td><td>'+p.remaining+'</td></tr>').join('');
    let memory=state.B3_memory;
    let batch=state.B3_stage?'<p><b>B3 '+esc(state.B3_stage)+'</b> · '+num(state.B3_stage_completed)+' / 31 · Worker '+state.workers.length+(memory?' · RAM '+num(memory.RAM_available/1073741824)+' GiB 가용 · Commit '+num(memory.Commit_total/1073741824)+' / '+num(memory.Commit_limit/1073741824)+' GiB':'')+'</p>':'';
    current.innerHTML=state.workers.length?state.workers.map(w=>'<p><b>'+esc(w.arm+' '+w.day)+'</b> · '+esc(w.phase)+' · <span class="'+(w.optimization_status.includes('NO SOLUTION')?'FAIL':'FEASIBLE')+'">'+esc(w.optimization_status)+'</span><br>Native '+num(w.Native_Runtime)+' s · 검증 UB '+num(w.initial_verified_UB)+' → '+num(w.final_verified_UB??w.UB)+'<br>'+gapPanel(w)+'<br><small>Fresh '+esc(w.Fresh)+' · PID '+w.PID+'</small></p>').join(''):'<p>'+esc(state.status)+'</p>';
    current.innerHTML=batch+current.innerHTML;
    errors.innerHTML=state.errors.length?state.errors.map(e=>'<p class="err">'+esc(e)+'</p>').join(''):'기록된 오류 없음';
    updated.textContent='자동 갱신 · '+new Date().toLocaleTimeString();
    source.textContent='Scientific Source '+state.source_SHA+' · '+state.root;days();
  }catch(e){updated.textContent='HTTP 연결 오류: '+e.message}
}
function days(){
  if(!state)return;let a=policy.value;
  document.getElementById('days').innerHTML=state.dates.filter(r=>r.arm===a).map(r=>'<button data-key="'+r.arm+'/'+r.day+'" class="'+r.status+'" onclick="show(this.dataset.key)">'+r.day.slice(-2)+' · '+r.status+'</button>').join('');
}
async function show(key){
  let r=await(await fetch('/api/date?key='+encodeURIComponent(key))).json();
  detailbody.innerHTML='<h3>'+esc(r.arm+' '+r.day+' · '+r.status)+'</h3><p>'+esc(r.optimization_status||'')+' · '+esc(r.AC_status||'')+'</p><p>'+esc(r.reason||'')+'</p>'+(['B2','B3'].includes(r.arm)?gapPanel(r):'')+'<pre>'+esc(JSON.stringify(r.metrics||{},null,2))+'</pre><details><summary>상세 실행 근거</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre></details>';
  detail.showModal();
}
update();setInterval(update,5000);
</script></html>
